<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Jutranjo poročilo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0a;
      --bg2:     rgba(255,255,255,0.055);
      --bg3:     rgba(255,255,255,0.08);
      --text:    #f0f0f0;
      --hint:    #666668;
      --accent:  #888;
      --green:   #30a46c;
      --danger:  #ff453a;
      --border:  rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.05);
      --shadow:  0 4px 20px rgba(0,0,0,0.6);
      --glass:   blur(20px) saturate(140%);
      --radius:  16px;
      --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #0a0a0a;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      padding: 4px;
      margin: 14px 16px 8px;
      border-radius: 12px;
      gap: 2px;
      border: 1px solid var(--border2);
    }
    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9px;
      cursor: pointer;
      color: var(--hint);
      transition: background 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tab.active {
      background: var(--bg3);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4), inset 0 0 0 1px var(--border);
    }

    /* ── PAGES ── */
    .page { display: none; padding: 0 16px 90px; }
    .page.active { display: block; }

    /* ── DAY HEADER ── */
    .day-block { margin-bottom: 4px; }
    .day-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 24px 2px 12px;
    }
    .day-block:first-child .day-header { padding-top: 10px; }
    .day-label {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .day-label.today { color: var(--accent); }
    .day-date {
      font-size: 13px;
      color: var(--hint);
      text-transform: capitalize;
      font-weight: 400;
    }

    /* ── EVENT CARD ── */
    .event-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      margin-bottom: 14px;
      overflow: hidden;
      transition: border-color 0.4s;
    }
    .event-card[data-progress="done"] {
      border-color: rgba(48, 164, 108, 0.3);
    }
    .event-card[data-progress="partial"] {
      border-color: rgba(26, 110, 216, 0.3);
    }

    /* ── EVENT HEADER INSIDE CARD ── */
    .event-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .event-header-left { flex: 1; min-width: 0; }
    .event-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
    }
    .event-meta {
      font-size: 12px;
      color: var(--hint);
      margin-top: 4px;
      font-weight: 400;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--hint);
    }

    /* ── PROGRESS BADGE ── */
    .progress-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--hint);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .progress-badge.partial {
      background: rgba(26,110,216,0.15);
      border-color: rgba(26,110,216,0.3);
      color: var(--accent);
    }
    .progress-badge.done {
      background: rgba(48,164,108,0.15);
      border-color: rgba(48,164,108,0.3);
      color: var(--green);
    }

    /* ── ITEMS ── */
    .items-body { padding: 8px 12px 10px; }
    .item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px;
      margin-bottom: 5px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      transition: opacity 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .item:last-of-type { margin-bottom: 0; }
    .item.done {
      opacity: 0.38;
    }
    .circle {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--hint);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .item.done .circle {
      background: var(--green);
      border-color: var(--green);
    }
    .circle svg { display: none; }
    .item.done .circle svg { display: block; }
    .label { font-size: 15px; font-weight: 400; flex: 1; }

    /* ── ADD CUSTOM ITEM ── */
    .add-item-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin: 6px 12px 10px;
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--accent);
      font-size: 14px;
      width: calc(100% - 24px);
      -webkit-tap-highlight-color: transparent;
    }
    .add-item-row {
      display: none;
      gap: 7px;
      margin: 6px 12px 10px;
    }
    .add-item-row.visible { display: flex; }
    .add-item-input {
      flex: 1;
      padding: 10px 13px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .add-item-input::placeholder { color: var(--hint); }
    .btn-sm {
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-sm.cancel { background: var(--bg3); color: var(--hint); border: 1px solid var(--border); }

    /* ── SETTINGS ── */
    .settings-section { margin-bottom: 32px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .settings-list {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg2);
      box-shadow: var(--shadow);
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .row-content { flex: 1; min-width: 0; }
    .row-title { font-size: 15px; }
    .row-sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn.edit { background: rgba(26,110,216,0.15); color: var(--accent); }
    .icon-btn.del  { background: rgba(255,69,58,0.15);  color: var(--danger); }
    .add-row-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      background: var(--bg2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: var(--shadow);
    }

    /* ── BOTTOM SHEET ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .sheet {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 12px 20px 50px;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    }
    .overlay.open .sheet { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .field-group { margin-bottom: 13px; }
    .field-label {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      padding: 0 2px;
      font-weight: 600;
    }
    .field-input {
      width: 100%;
      padding: 13px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    .field-input::placeholder { color: var(--hint); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    .btn-cancel {
      padding: 14px 18px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── STATES ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50vh;
      opacity: 0.35;
      font-size: 15px;
    }
    #error {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: var(--danger);
      font-size: 15px;
    }
    .s-loading {
      text-align: center;
      padding: 40px;
      color: var(--hint);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">Nalagam...</div>
  <div id="error"></div>

  <div id="app" style="display:none">
    <div class="tabs">
      <div class="tab active" data-tab="checklist">📅 Koledar</div>
      <div class="tab" data-tab="settings">⚙ Nastavitve</div>
    </div>
    <div class="page active" id="page-checklist">
      <div id="items"></div>
    </div>
    <div class="page" id="page-settings">
      <div id="settings-content"><div class="s-loading">Nalagam...</div></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <div id="sheet-fields"></div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeSheet()">Prekliči</button>
        <button class="btn-primary" id="sheet-save">Shrani</button>
      </div>
    </div>
  </div>

  <script>
    const _orig = window.fetch.bind(window);
    window.fetch = (url, opts = {}) => {
      if (typeof url === 'string' && url.includes('ngrok')) {
        opts = { ...opts, headers: { ...(opts.headers || {}), 'ngrok-skip-browser-warning': 'true' } };
      }
      return _orig(url, opts);
    };

    const BASE       = 'https://n8ndeniss.duckdns.org/webhook';
    const N8N_STATE  = `${BASE}/checklist-state`;
    const N8N_TOGGLE = `${BASE}/checklist-toggle`;
    const N8N_CUSTOM = `${BASE}/checklist-add-custom`;
    const N8N_SGET   = `${BASE}/settings-get`;
    const N8N_SADD   = `${BASE}/settings-add`;
    const N8N_SDEL   = `${BASE}/settings-delete`;

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(location.search);
    const msgId  = params.get('msg_id');

    // ── TABS ─────────────────────────────────────────────────────────────
    let settingsLoaded = false;
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`page-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'settings' && !settingsLoaded) {
          loadSettings();
          settingsLoaded = true;
        }
      });
    });

    // ── CHECKLIST ────────────────────────────────────────────────────────
    async function loadState() {
      const res = await fetch(`${N8N_STATE}?msg_id=${encodeURIComponent(msgId)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (!text || !text.trim()) return [];
      try {
        const r = JSON.parse(text);
        return Array.isArray(r) ? r : (r.data || []);
      } catch { return []; }
    }

    async function doToggle(item, status) {
      await fetch(`${N8N_TOGGLE}?msg_id=${encodeURIComponent(msgId)}&item=${encodeURIComponent(item)}&status=${status}`);
    }

    async function doAddCustom(eventTitle, itemName) {
      await fetch(`${N8N_CUSTOM}?msg_id=${encodeURIComponent(msgId)}&event_title=${encodeURIComponent(eventTitle)}&item=${encodeURIComponent(itemName)}`);
    }

    function updateCardProgress(card) {
      const items = card.querySelectorAll('.item');
      if (!items.length) return;
      const total = items.length;
      const done  = [...items].filter(i => i.classList.contains('done')).length;
      const badge = card.querySelector('.progress-badge');
      if (!badge) return;
      badge.textContent = `${done}/${total}`;
      if (done === total) {
        badge.className = 'progress-badge done';
        card.dataset.progress = 'done';
      } else if (done > 0) {
        badge.className = 'progress-badge partial';
        card.dataset.progress = 'partial';
      } else {
        badge.className = 'progress-badge';
        card.dataset.progress = '';
      }
    }

    function makeItemEl(itemName, status, card) {
      const el = document.createElement('div');
      el.className = `item ${status === 'done' ? 'done' : ''}`;
      el.innerHTML = `
        <div class="circle">
          <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
            <path d="M1 4.5L4 7.5L10 1.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="label">${itemName}</span>`;
      let busy = false;
      el.addEventListener('click', async () => {
        if (busy) return; busy = true;
        const was  = el.classList.contains('done');
        const next = was ? 'pending' : 'done';
        el.classList.toggle('done');
        updateCardProgress(card);
        try { await doToggle(itemName, next); tg?.HapticFeedback?.impactOccurred('light'); }
        catch { el.classList.toggle('done'); updateCardProgress(card); }
        busy = false;
      });
      return el;
    }

    function makeAddRow(body, eventTitle, card) {
      const btn = document.createElement('button');
      btn.className = 'add-item-btn';
      btn.innerHTML = `<span style="font-size:16px;line-height:1">+</span> Dodaj item`;

      const row = document.createElement('div');
      row.className = 'add-item-row';
      row.innerHTML = `
        <input class="add-item-input" placeholder="Ime itema...">
        <button class="btn-sm cancel">✕</button>
        <button class="btn-sm confirm">Dodaj</button>`;

      const inp  = row.querySelector('input');
      const canc = row.querySelector('.cancel');
      const conf = row.querySelector('.confirm');

      btn.onclick = () => { btn.style.display = 'none'; row.classList.add('visible'); inp.focus(); };
      canc.onclick = () => { btn.style.display = ''; row.classList.remove('visible'); inp.value = ''; };
      conf.onclick = async () => {
        const val = inp.value.trim();
        if (!val) return;
        conf.disabled = true;
        try {
          await doAddCustom(eventTitle, val);
          body.insertBefore(makeItemEl(val, 'pending', card), btn);
          updateCardProgress(card);
          inp.value = '';
          btn.style.display = '';
          row.classList.remove('visible');
          tg?.HapticFeedback?.impactOccurred('light');
        } catch { conf.disabled = false; }
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') conf.click(); });

      body.appendChild(btn);
      body.appendChild(row);
    }

    function fmtTime(dt) {
      if (!dt) return null;
      try { return new Date(dt).toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit' }); }
      catch { return null; }
    }

    function fmtDate(dateStr) {
      try { return new Date(dateStr + 'T00:00:00').toLocaleDateString('sl-SI', { weekday: 'long', day: 'numeric', month: 'long' }); }
      catch { return dateStr; }
    }

    function render(items) {
      const container = document.getElementById('items');
      const today    = new Date().toISOString().split('T')[0];
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];

      const byDay = {};
      items.forEach(row => {
        let day = today;
        if (row.event_time) {
          try { day = new Date(row.event_time).toISOString().split('T')[0]; }
          catch { day = row.datum || today; }
        } else if (row.datum) { day = row.datum; }
        if (!byDay[day]) byDay[day] = {};
        const key = row.event_title || '—';
        if (!byDay[day][key]) byDay[day][key] = { rows: [], time: row.event_time, loc: row.event_location };
        byDay[day][key].rows.push(row);
      });

      if (!Object.keys(byDay).length) {
        container.innerHTML = '<div class="s-loading">Ni dogodkov za danes.</div>';
        return;
      }

      Object.keys(byDay).sort().forEach(day => {
        const dayBlock = document.createElement('div');
        dayBlock.className = 'day-block';

        const dayHdr = document.createElement('div');
        dayHdr.className = 'day-header';
        const isToday    = day === today;
        const isTomorrow = day === tomorrow;
        const label      = isToday ? 'Danes' : isTomorrow ? 'Jutri' : fmtDate(day);
        const labelClass = isToday ? 'today' : '';
        const sub        = (isToday || isTomorrow) ? fmtDate(day) : '';
        dayHdr.innerHTML = `<span class="day-label ${labelClass}">${label}</span>${sub ? `<span class="day-date">${sub}</span>` : ''}`;
        dayBlock.appendChild(dayHdr);

        Object.entries(byDay[day])
          .sort(([, a], [, b]) => (a.time ? new Date(a.time).getTime() : 0) - (b.time ? new Date(b.time).getTime() : 0))
          .forEach(([title, { rows, time, loc }]) => {

            // card wrapper
            const card = document.createElement('div');
            card.className = 'event-card';

            // event header
            const evHdr = document.createElement('div');
            evHdr.className = 'event-header';

            const left = document.createElement('div');
            left.className = 'event-header-left';
            left.innerHTML = `<div class="event-title">${title}</div>`;

            const meta = [];
            const t = fmtTime(time);
            if (t) meta.push(`<span class="meta-pill">🕐 ${t}</span>`);
            if (loc) meta.push(`<span class="meta-pill">📍 ${loc}</span>`);
            if (meta.length) left.innerHTML += `<div class="event-meta">${meta.join('')}</div>`;

            const badge = document.createElement('div');
            badge.className = 'progress-badge';
            badge.textContent = '0/0';

            evHdr.appendChild(left);
            evHdr.appendChild(badge);
            card.appendChild(evHdr);

            // items body
            const body = document.createElement('div');
            body.className = 'items-body';

            rows
              .filter(({ item }) => item !== '_no_items')
              .forEach(({ item, status }) => body.appendChild(makeItemEl(item, status, card)));

            card.appendChild(body);
            makeAddRow(body, title, card);
            updateCardProgress(card);

            dayBlock.appendChild(card);
          });

        container.appendChild(dayBlock);
      });
    }

    // ── SETTINGS ─────────────────────────────────────────────────────────
    let sData = { keywords: [], checklists: [] };

    async function loadSettings() {
      try {
        const res = await fetch(N8N_SGET);
        const d = await res.json();
        sData = Array.isArray(d) ? d[0] : d;
        renderSettings();
      } catch {
        document.getElementById('settings-content').innerHTML =
          '<div class="s-loading" style="color:var(--danger)">Napaka pri nalaganju.</div>';
      }
    }

    async function refreshSettings() {
      const res = await fetch(N8N_SGET);
      const d = await res.json();
      sData = Array.isArray(d) ? d[0] : d;
      renderSettings();
    }

    function renderSettings() {
      const c = document.getElementById('settings-content');
      c.innerHTML = '';
      const gmail = (sData.keywords || []).filter(k => k.tip === 'gmail');
      const chk   = sData.checklists || [];

      c.appendChild(makeSection('Gmail keywords', gmail,
        r => r.keyword,
        r => `${r.dni_nazaj} dni nazaj`,
        () => openSheet('gmail'),
        r => openSheet('gmail', r)
      ));

      c.appendChild(makeSection('Checklist paketi', chk,
        r => r.item,
        () => null,
        () => openSheet('checklist'),
        r => openSheet('checklist', r),
        r => r.keyword
      ));
    }

    function makeSection(title, rows, labelFn, subFn, onAdd, onEdit, groupByFn = null) {
      const sec = document.createElement('div');
      sec.className = 'settings-section';
      sec.innerHTML = `<div class="section-title">${title}</div>`;

      const makeRowEl = (row) => {
        const el = document.createElement('div');
        el.className = 'settings-row';
        const sub = subFn(row);
        el.innerHTML = `
          <div class="row-content">
            <div class="row-title">${labelFn(row)}</div>
            ${sub ? `<div class="row-sub">${sub}</div>` : ''}
          </div>
          <button class="icon-btn edit" title="Uredi">✎</button>
          <button class="icon-btn del"  title="Izbriši">✕</button>`;
        el.querySelector('.edit').onclick = () => onEdit(row);
        el.querySelector('.del').onclick  = () => delRow(row);
        return el;
      };

      if (groupByFn) {
        const groups = {};
        rows.forEach(row => {
          const key = groupByFn(row);
          if (!groups[key]) groups[key] = [];
          groups[key].push(row);
        });
        Object.entries(groups).forEach(([groupTitle, groupRows]) => {
          const groupEl = document.createElement('div');
          groupEl.style.marginBottom = '16px';
          const groupHeader = document.createElement('div');
          groupHeader.style.cssText = 'font-size:12px;color:var(--hint);padding:0 4px 6px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em';
          groupHeader.textContent = groupTitle;
          groupEl.appendChild(groupHeader);
          const list = document.createElement('div');
          list.className = 'settings-list';
          groupRows.forEach(row => list.appendChild(makeRowEl(row)));
          groupEl.appendChild(list);

          const groupAddBtn = document.createElement('button');
          groupAddBtn.className = 'add-row-btn';
          groupAddBtn.style.marginTop = '4px';
          groupAddBtn.innerHTML = `<span style="font-size:16px">+</span> Dodaj item`;

          const inlineRow = document.createElement('div');
          inlineRow.className = 'add-item-row';
          inlineRow.style.marginTop = '4px';
          inlineRow.innerHTML = `
            <input class="add-item-input" placeholder="Nov item...">
            <button class="btn-sm cancel">✕</button>
            <button class="btn-sm confirm">↵</button>`;

          const inp  = inlineRow.querySelector('input');
          const canc = inlineRow.querySelector('.cancel');
          const conf = inlineRow.querySelector('.confirm');

          const saveInline = async () => {
            const val = inp.value.trim();
            if (!val) return;
            conf.disabled = true;
            await fetch(`${N8N_SADD}?keyword=${encodeURIComponent(groupTitle)}&item=${encodeURIComponent(val)}`);
            inp.value = '';
            conf.disabled = false;
            inlineRow.classList.remove('visible');
            groupAddBtn.style.display = '';
            await refreshSettings();
          };

          groupAddBtn.onclick = () => {
            groupAddBtn.style.display = 'none';
            inlineRow.classList.add('visible');
            inp.focus();
          };
          canc.onclick = () => {
            inlineRow.classList.remove('visible');
            groupAddBtn.style.display = '';
            inp.value = '';
          };
          conf.onclick = saveInline;
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveInline(); });

          groupEl.appendChild(groupAddBtn);
          groupEl.appendChild(inlineRow);
          sec.appendChild(groupEl);
        });
      } else {
        const list = document.createElement('div');
        list.className = 'settings-list';
        rows.forEach(row => list.appendChild(makeRowEl(row)));
        sec.appendChild(list);
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'add-row-btn';
      addBtn.style.cssText = 'opacity:0.55;font-size:13px;margin-top:4px';
      addBtn.innerHTML = `<span style="font-size:15px">+</span> Nov keyword`;
      addBtn.onclick = onAdd;
      sec.appendChild(addBtn);
      return sec;
    }

    async function delRow(row) {
      const sheet = row.tip !== undefined ? 'Keywords' : 'Checklists';
      const name  = row.keyword || row.item;
      if (!confirm(`Izbriši "${name}"?`)) return;
      await fetch(`${N8N_SDEL}?sheet=${sheet}&row_number=${row.row_number}`);
      await refreshSettings();
    }

    // ── BOTTOM SHEET ─────────────────────────────────────────────────────
    function openSheet(type, existing = null, prefillKeyword = null) {
      const overlay = document.getElementById('overlay');
      document.getElementById('sheet-title').textContent = existing ? 'Uredi' : 'Dodaj';
      const fields = document.getElementById('sheet-fields');
      fields.innerHTML = '';

      const field = (id, label, placeholder, value = '', type = 'text') => `
        <div class="field-group">
          <div class="field-label">${label}</div>
          <input class="field-input" id="${id}" type="${type}" placeholder="${placeholder}" value="${value}">
        </div>`;

      let saveFn;
      if (type === 'gmail') {
        fields.innerHTML =
          field('f-kw',  'Ključna beseda', 'npr. fotografiranje', existing?.keyword || '') +
          field('f-dni', 'Dni nazaj',       '7',                   existing?.dni_nazaj || '', 'number');
        saveFn = async () => {
          const kw  = document.getElementById('f-kw').value.trim();
          const dni = document.getElementById('f-dni').value.trim();
          if (!kw) return;
          const btn = document.getElementById('sheet-save');
          if (btn.disabled) return;
          btn.disabled = true;
          btn.innerHTML = '<div class="spinner"></div> Shranjujem...';
          await new Promise(r => setTimeout(r, 50));
          if (existing) await fetch(`${N8N_SDEL}?sheet=Keywords&row_number=${existing.row_number}`);
          await fetch(`${N8N_SADD}?tip=gmail&keyword=${encodeURIComponent(kw)}&dni_nazaj=${dni}`);
          if (existing) {
            const idx = sData.keywords.findIndex(k => k.row_number === existing.row_number);
            if (idx !== -1) sData.keywords[idx] = { ...sData.keywords[idx], keyword: kw, dni_nazaj: parseInt(dni) };
          } else {
            sData.keywords.push({ tip: 'gmail', keyword: kw, dni_nazaj: parseInt(dni), row_number: 9999 });
          }
          closeSheet(); renderSettings();
          btn.disabled = false;
          btn.innerHTML = 'Shrani';
          refreshSettings();
        };
      } else {
        fields.innerHTML =
          field('f-kw',  'Keyword (kategorija)', 'npr. masaža', prefillKeyword || existing?.keyword || '') +
          field('f-item','Item',                  'npr. olje',   existing?.item    || '');
        saveFn = async () => {
          const kw  = document.getElementById('f-kw').value.trim();
          const itm = document.getElementById('f-item').value.trim();
          if (!kw || !itm) return;
          const btn = document.getElementById('sheet-save');
          if (btn.disabled) return;
          btn.disabled = true;
          btn.innerHTML = '<div class="spinner"></div> Shranjujem...';
          await new Promise(r => setTimeout(r, 50));
          if (existing) await fetch(`${N8N_SDEL}?sheet=Checklists&row_number=${existing.row_number}`);
          await fetch(`${N8N_SADD}?keyword=${encodeURIComponent(kw)}&item=${encodeURIComponent(itm)}`);
          if (existing) {
            const idx = sData.checklists.findIndex(c => c.row_number === existing.row_number);
            if (idx !== -1) sData.checklists[idx] = { ...sData.checklists[idx], keyword: kw, item: itm };
          } else {
            sData.checklists.push({ keyword: kw, item: itm, row_number: 9999 });
          }
          closeSheet(); renderSettings();
          btn.disabled = false;
          btn.innerHTML = 'Shrani';
          refreshSettings();
          btn.innerHTML = 'Shrani';
        };
      }

      document.getElementById('sheet-save').onclick = saveFn;
      overlay.classList.add('open');
      setTimeout(() => fields.querySelector('.field-input')?.focus(), 350);
    }

    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
    }
    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target.id === 'overlay') closeSheet();
    });

    // ── INIT ─────────────────────────────────────────────────────────────
    (async () => {
      try {
        if (!msgId) throw new Error('no msg_id');
        const items = await loadState();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        render(items);
      } catch (e) {
        console.error(e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = 'Napaka pri nalaganju. Zapri in poskusi znova.';
        document.getElementById('error').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
